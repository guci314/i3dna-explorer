# pytest 配置
[pytest]
# 测试发现
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试路径
testpaths = tests

# 标记
markers =
    slow: 标记慢速测试
    visual: 标记视觉/快照测试
    integration: 标记集成测试（需真实包）
    unit: 标记单元测试

# 输出选项
addopts =
    -v
    --tb=short
    --strict-markers
    # --cov=i3dna_explorer  # 取消注释启用覆盖率
    # --cov-report=html

# QT 环境变量
env =
    QT_QPA_PLATFORM=offscreen

# 日志
log_cli = false
log_cli_level = INFO

# 最版本
minversion = 7.0
